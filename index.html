<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="todo-container">
    <!-- Header -->
    <header class="todo-header">
      <h1>To-Do List</h1>
      <p class="subtitle">Keep track of your daily tasks</p>
    </header>

    <!-- Task Input Form -->
    <form id="todo-form" class="todo-form">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="What do you need to do?" 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <!-- Filter Buttons -->
    <div class="filter-group">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="active">Active</button>
      <button type="button" class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Task List -->
    <ul id="todo-list" class="todo-list">
      <!-- Items dynamically generated by app.js -->
    </ul>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state hidden">
      <p>No tasks found</p>
    </div>

    <!-- Footer Stats & Actions -->
    <footer class="todo-footer">
      <span id="items-left">0 items left</span>
      <button type="button" id="clear-completed-btn" class="clear-btn">Clear completed</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
